sentence=Arduino Matter API for RP2040/RP2350 hosts, bridged to an ESP32-C6 running iLabs Hearth firmware over the iLabs AT+MT UART protocol.
paragraph=Source-compatible with the arduino-esp32 Matter class API, so an unmodified sketch builds and runs on a Challenger. The Matter stack runs on an ESP32-C6 flashed with the iLabs Hearth firmware; this library speaks that AT protocol over the UART the board variant wires to the co-processor, and resets it into a known state on first use, so a sketch never names a serial port. Call Matter.begin() as the last step after all endpoints are initialized. Also supplies the Preferences API and BOOT_PIN, neither of which arduino-pico has, so the upstream examples compile unmodified. iLabs Challenger+ platform.
